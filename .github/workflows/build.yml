      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6
          cache-disabled: true

      - name: Build Debug APK
        run: |
          cd project_folder
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HindiScan-APK
          path: project_folder/app/build/outputs/apk/debug/app-debug.apk
