name: Build HindiScan APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

# यह लाइन GitHub Actions को रिलीज़ बनाने की अनुमति देगी
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          unzip Project.zip -d project_folder

      - name: Generate Premium UI Code Files
        run: |
          cd project_folder
          BASE_DIR="app/src/main/java/com/example/hindiscan"
          mkdir -p $BASE_DIR
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/xml
          
          # --- पुरानी सारी गलत फाइलों को डिलीट करना ---
          rm -rf $BASE_DIR/*
          
          # --- CREATE APP ICON ---
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#8B5CF6" android:pathData="M17,3H7c-1.1,0 -1.99,0.9 -1.99,2L5,21c0,1.1 0.9,2 2,2h10c1.1,0 2,-0.9 2,-2V5c0,-1.1 -0.9,-2 -2,-2zM17,19H7V5h10v14zM10,7h4v2h-4zM10,11h4v2h-4zM10,15h4v2h-4z"/>
          </vector>
          EOF

          # --- FILE PATHS FOR UPDATER ---
          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="cache" path="." />
          </paths>
          EOF

          # --- 1. AndroidManifest.xml ---
          mkdir -p app/src/main
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="HindiScan"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data android:name="com.google.mlkit.vision.DEPENDENCIES" android:value="ocr" />
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="\${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>
              </application>
          </manifest>
          EOF

          # --- 2. app/build.gradle.kts ---
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.serialization")
          }
          android {
              namespace = "com.example.hindiscan"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.hindiscan"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 17
                  versionName = "17.0"
              }
              buildFeatures { compose = true; buildConfig = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              packaging { resources.excludes += "/META-INF/{AL2.0,LGPL2.1}" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.foundation:foundation")
              implementation("com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1")
              implementation("com.google.mlkit:text-recognition:16.0.0")
              implementation("com.google.mlkit:text-recognition-devanagari:16.0.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("androidx.security:security-crypto:1.1.0-alpha06")
              implementation("androidx.documentfile:documentfile:1.0.1")
          }
          EOF

          # --- 3. Models.kt ---
          cat << 'EOF' > $BASE_DIR/Models.kt
          package com.example.hindiscan
          import kotlinx.serialization.Serializable
          import android.net.Uri
          
          @Serializable
          data class Question(
              val topic: String = "General", 
              val type: String = "gs", 
              val exam: String = "", 
              val q: String = "", 
              val options: List<String> = emptyList(), 
              val ans: Int = 0, 
              val exp: String = ""
          )
          
          data class ScanUiState(
              val isProcessing: Boolean = false, val progressText: String = "", val progress: Float = 0f,
              val questions: List<Question> = emptyList(), val rawJson: String = "", val error: String? = null,
              val savedMsg: String? = null, val pendingUris: List<Uri>? = null,
              val updateUrl: String? = null, val updateVersion: String? = null
          )
          data class ApiKeys(val gemini: String = "", val groq: String = "", val openai: String = "")
          EOF

          # --- 4. Theme.kt ---
          cat << 'EOF' > $BASE_DIR/Theme.kt
          package com.example.hindiscan
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color
          private val PremiumDark = darkColorScheme(
              primary = Color(0xFF8B5CF6), onPrimary = Color.White, primaryContainer = Color(0xFF4C1D95), onPrimaryContainer = Color(0xFFEDE9FE),
              secondary = Color(0xFF06B6D4), onSecondary = Color.White, secondaryContainer = Color(0xFF164E63), onSecondaryContainer = Color(0xFFCFFAFE),
              background = Color(0xFF09090B), onBackground = Color(0xFFFAFAFA), surface = Color(0xFF18181B), onSurface = Color(0xFFFAFAFA),
              surfaceVariant = Color(0xFF27272A), onSurfaceVariant = Color(0xFFA1A1AA), outline = Color(0xFF3F3F46),
              error = Color(0xFFF87171), onError = Color(0xFF450A0A), errorContainer = Color(0xFF7F1D1D), onErrorContainer = Color(0xFFFEE2E2)
          )
          @Composable
          fun HindiScanTheme(content: @Composable () -> Unit) { MaterialTheme(colorScheme = PremiumDark, content = content) }
          EOF

          # --- 5. AppStore.kt ---
          cat << 'EOF' > $BASE_DIR/AppStore.kt
          package com.example.hindiscan
          import android.content.Context
          import androidx.security.crypto.EncryptedSharedPreferences
          import androidx.security.crypto.MasterKey
          class AppStore(context: Context) {
              private val prefs = EncryptedSharedPreferences.create(context, "secure_prefs", MasterKey.Builder(context).setKeyScheme(MasterKey.KeyScheme.AES256_GCM).build(), EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV, EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM)
              fun getKeys(): ApiKeys = ApiKeys(gemini = prefs.getString("gemini_key", "") ?: "", groq = prefs.getString("groq_key", "") ?: "", openai = prefs.getString("openai_key", "") ?: "")
              fun saveKeys(keys: ApiKeys) { prefs.edit().apply { putString("gemini_key", keys.gemini.trim()); putString("groq_key", keys.groq.trim()); putString("openai_key", keys.openai.trim()) }.apply() }
              fun clearKeys() = prefs.edit().clear().apply()
          }
          EOF

          # --- 6. OcrEngine.kt ---
          cat << 'EOF' > $BASE_DIR/OcrEngine.kt
          package com.example.hindiscan
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.pdf.PdfRenderer
          import android.net.Uri
          import android.os.ParcelFileDescriptor
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.TextRecognizer
          import com.google.mlkit.vision.text.devanagari.DevanagariTextRecognizerOptions
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.suspendCancellableCoroutine
          import kotlinx.coroutines.withContext
          import kotlinx.coroutines.withTimeout
          import java.io.File
          import java.io.FileOutputStream
          import kotlin.coroutines.resume
          import kotlin.coroutines.resumeWithException

          class OcrEngine(private val context: Context) {
              private val devanagari: TextRecognizer = TextRecognition.getClient(DevanagariTextRecognizerOptions.Builder().build())
              private val latin: TextRecognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)

              suspend fun recognize(uri: Uri): String = withContext(Dispatchers.IO) {
                  try {
                      withTimeout(60000) { 
                          val mimeType = context.contentResolver.getType(uri)
                          if (mimeType == "application/pdf") {
                              val tempFile = File.createTempFile("ocr_", ".pdf", context.cacheDir)
                              context.contentResolver.openInputStream(uri)?.use { input -> FileOutputStream(tempFile).use { output -> input.copyTo(output) } } ?: throw Exception("PDF not opened.")
                              val result = recognizePdf(tempFile)
                              tempFile.delete()
                              result
                          } else {
                              val inputStream = context.contentResolver.openInputStream(uri) ?: throw Exception("Image not opened.")
                              val bitmap = BitmapFactory.decodeStream(inputStream)
                              inputStream.close()
                              if (bitmap == null) throw Exception("Image not decoded.")
                              val image = InputImage.fromBitmap(bitmap, 0)
                              val result = pickBest(runRecognizer(devanagari, image), runRecognizer(latin, image))
                              bitmap.recycle()
                              result
                          }
                      }
                  } catch (e: Exception) {
                      if (e is kotlinx.coroutines.TimeoutCancellationException) throw Exception("Timeout. Document too large.")
                      throw e
                  }
              }

              private suspend fun recognizePdf(file: File): String = withContext(Dispatchers.IO) {
                  val sb = StringBuilder()
                  try {
                      ParcelFileDescriptor.open(file, ParcelFileDescriptor.MODE_READ_ONLY).use { pfd ->
                          PdfRenderer(pfd).use { renderer ->
                              val pageCount = minOf(renderer.pageCount, 10)
                              for (i in 0 until pageCount) {
                                  try {
                                      renderer.openPage(i).use { page ->
                                          val maxDim = maxOf(page.width, page.height).toFloat()
                                          val scale = if (maxDim > 1500f) 1500f / maxDim else 1f
                                          val w = (page.width * scale).toInt(); val h = (page.height * scale).toInt()
                                          val bmp = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                                          bmp.eraseColor(Color.WHITE); page.render(bmp, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY)
                                          val devText = try { runRecognizer(devanagari, InputImage.fromBitmap(bmp, 0)) } catch (e: Exception) { "" }
                                          val latText = try { runRecognizer(latin, InputImage.fromBitmap(bmp, 0)) } catch (e: Exception) { "" }
                                          val pageText = pickBest(devText, latText)
                                          if (pageText.isNotBlank()) sb.append(pageText).append("\n\n")
                                          bmp.recycle()
                                      }
                                  } catch (e: Exception) { e.printStackTrace() }
                              }
                          }
                      }
                  } catch (e: Exception) { throw Exception("PDF Render Error: ${e.message}") }
                  return@withContext sb.toString()
              }

              private suspend fun runRecognizer(rec: TextRecognizer, image: InputImage): String = suspendCancellableCoroutine { cont ->
                  rec.process(image).addOnSuccessListener { cont.resume(it.text) }.addOnFailureListener { cont.resumeWithException(it) }
              }
              private fun pickBest(devText: String, latText: String): String {
                  val devCount = devText.count { it in '\u0900'..'\u097F' }
                  val latCount = latText.count { it.isLetter() && it !in '\u0900'..'\u097F' }
                  return if (devCount >= latCount) devText else latText
              }
              fun close() { devanagari.close(); latin.close() }
          }
          EOF

          # --- 7. AiProcessor.kt (FIXED MODELS) ---
          cat << 'EOF' > $BASE_DIR/AiProcessor.kt
          package com.example.hindiscan
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import kotlinx.serialization.encodeToString
          import kotlinx.serialization.json.Json
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.concurrent.TimeUnit

          class AiProcessor(private val keys: ApiKeys) {
              private val http = OkHttpClient.Builder().connectTimeout(60, TimeUnit.SECONDS).readTimeout(300, TimeUnit.SECONDS).build()
              private val json = Json { ignoreUnknownKeys = true; encodeDefaults = true }
              
              suspend fun process(ocrText: String, targetLang: String, onProgress: (String, Float) -> Unit): List<Question> = withContext(Dispatchers.IO) {
                  if (keys.gemini.isBlank() && keys.groq.isBlank() && keys.openai.isBlank()) throw IllegalStateException("No API Keys found.")
                  if (ocrText.isBlank()) throw IllegalStateException("OCR returned empty text.")
                  
                  val chunks = chunkText(ocrText, 14000)
                  val extracted = mutableListOf<Question>()
                  chunks.forEachIndexed { idx, chunk ->
                      onProgress("Analyzing text (${idx + 1}/${chunks.size})...", (idx.toFloat() / chunks.size) * 0.5f)
                      extracted += extractChunk(chunk, targetLang)
                  }
                  val deduped = dedupe(extracted); onProgress("${deduped.size} questions found — verifying...", 0.55f)
                  val verified = mutableListOf<Question>(); val batches = deduped.chunked(12)
                  batches.forEachIndexed { idx, batch ->
                      onProgress("Verifying (${idx + 1}/${batches.size})...", 0.55f + (idx.toFloat() / batches.size) * 0.45f)
                      try { verified += verifyBatch(batch, targetLang) } catch (_: Exception) { verified += batch.filter { validateQuestion(it) } }
                  }
                  val finalList = verified.filter { validateQuestion(it) }.distinctBy { normKey(it.q) }
                  onProgress("Complete: ${finalList.size} verified questions", 1f); finalList
              }

              private fun buildExtractPrompt(chunk: String, targetLang: String) = """
                  You are a senior language expert. Extract EVERY authentic question from OCR text.
                  CRITICAL RULE: Output ALL extracted questions, options, and explanations STRICTLY in $targetLang language. 
                  
                  Formatting Rules:
                  1. The JSON must have EXACTLY these keys: "topic", "type", "exam", "q", "options", "ans", "exp".
                  2. "exam": Extract the exam name (e.g., "UPPSC LT Grade 2018").
                  3. "q": The question text MUST end with [Exam Name]. Use <br> for line breaks.
                  4. "topic": Auto-detect and format like "सामान्य अध्ययन: [Specific Topic] ([Exam Name])".
                  5. "options": Exactly 4 unique strings. Match options format like "1-(b), 2-(a)".
                  6. "ans": Integer (0, 1, 2, or 3).
                  7. "exp": Detailed explanation ending with "यह प्रश्न [Exam Name] में पूछा गया था।".
                  8. Match the following: Use HTML <table> format with border='1', cellpadding='6', style='border-collapse:collapse; width:100%; text-align:left; margin:8px 0;'.
                  9. Output ONLY a valid JSON array. NO markdown, NO ```json.
                  
                  JSON format: [ { "topic": "...", "type": "gs", "exam": "...", "q": "...", "options": ["...","...","...","..."], "ans": 0, "exp": "..." } ]
                  OCR TEXT: $chunk
              """.trimIndent()

              private fun extractChunk(chunk: String, targetLang: String) = parseQuestions(callAi(buildExtractPrompt(chunk, targetLang)))
              private fun verifyBatch(batch: List<Question>, targetLang: String) = parseQuestions(callAi("""
                  You are a senior language auditor. FIX and FILTER this JSON array.
                  CRITICAL RULE: Ensure ALL text is in $targetLang language.
                  1. Correct spelling/grammar. 2. Remove answer leaks. 3. Exactly 4 unique options. 4. ans must be 0..3.
                  5. Output ONLY JSON array of APPROVED questions.
                  INPUT: ${json.encodeToString(batch)}
              """.trimIndent()))

              private fun callAi(prompt: String): String {
                  var errorMsg = ""
                  if (keys.gemini.isNotBlank()) { try { return callGemini(prompt) } catch (e: Exception) { errorMsg += "Gemini: ${e.message}\n" } }
                  if (keys.groq.isNotBlank()) { try { return callGroq(prompt) } catch (e: Exception) { errorMsg += "Groq: ${e.message}\n" } }
                  if (keys.openai.isNotBlank()) { try { return callOpenAi(prompt) } catch (e: Exception) { errorMsg += "OpenAI: ${e.message}\n" } }
                  throw Exception("API Failed:\n$errorMsg")
              }

              private fun callGemini(prompt: String): String {
                  // FIXED: Using the correct and latest Gemini models
                  val models = listOf("gemini-1.5-flash", "gemini-1.5-pro")
                  for (model in models) {
                      val url = "https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent?key=${keys.gemini}"
                      val payload = JSONObject().put("contents", JSONArray().put(JSONObject().put("parts", JSONArray().put(JSONObject().put("text", prompt)))))
                          .put("generationConfig", JSONObject().put("temperature", 0.05).put("maxOutputTokens", 8192).put("responseMimeType", "application/json")).toString()
                      http.newCall(Request.Builder().url(url).post(payload.toRequestBody("application/json".toMediaType())).build()).execute().use { resp ->
                          if (resp.isSuccessful) {
                              val text = JSONObject(resp.body!!.string()).optJSONArray("candidates")?.optJSONObject(0)?.optJSONObject("content")?.optJSONArray("parts")?.optJSONObject(0)?.optString("text") ?: ""
                              if (text.isNotBlank()) return text
                          } else { throw Exception("HTTP ${resp.code}") }
                      }
                  }
                  throw Exception("Gemini Failed")
              }

              private fun callGroq(prompt: String): String {
                  val url = "https://api.groq.com/openai/v1/chat/completions"
                  // FIXED: Using the latest stable Groq model
                  val payload = JSONObject().put("model", "llama-3.3-70b-versatile")
                      .put("messages", JSONArray().put(JSONObject().put("role", "user").put("content", prompt)))
                      .put("temperature", 0.05).toString()
                  val req = Request.Builder().url(url).addHeader("Authorization", "Bearer ${keys.groq}").post(payload.toRequestBody("application/json".toMediaType())).build()
                  http.newCall(req).execute().use { resp ->
                      if (resp.isSuccessful) {
                          val text = JSONObject(resp.body!!.string()).optJSONArray("choices")?.optJSONObject(0)?.optJSONObject("message")?.optString("content") ?: ""
                          if (text.isNotBlank()) return text
                      } else { throw Exception("HTTP ${resp.code}") }
                  }
                  throw Exception("Groq Failed")
              }

              private fun callOpenAi(prompt: String): String {
                  val url = "https://api.openai.com/v1/chat/completions"
                  val payload = JSONObject().put("model", "gpt-4o-mini")
                      .put("messages", JSONArray().put(JSONObject().put("role", "user").put("content", prompt)))
                      .put("temperature", 0.05).toString()
                  val req = Request.Builder().url(url).addHeader("Authorization", "Bearer ${keys.openai}").post(payload.toRequestBody("application/json".toMediaType())).build()
                  http.newCall(req).execute().use { resp ->
                      if (resp.isSuccessful) {
                          val text = JSONObject(resp.body!!.string()).optJSONArray("choices")?.optJSONObject(0)?.optJSONObject("message")?.optString("content") ?: ""
                          if (text.isNotBlank()) return text
                      } else { throw Exception("HTTP ${resp.code}") }
                  }
                  throw Exception("OpenAI Failed")
              }

              private fun parseQuestions(raw: String): List<Question> {
                  var cleaned = raw.trim().replace("```json", "").replace("```", "").trim()
                  val start = cleaned.indexOf('['); val end = cleaned.lastIndexOf(']')
                  if (start == -1 || end == -1 || end <= start) throw Exception("AI did not return valid JSON array.")
                  cleaned = cleaned.substring(start, end + 1)
                  return try {
                      val arr = JSONArray(cleaned); val list = mutableListOf<Question>()
                      for (i in 0 until arr.length()) {
                          try {
                              val obj = arr.getJSONObject(i); val q = obj.optString("q", "").trim(); val opts = obj.optJSONArray("options")
                              if (q.isNotBlank() && opts != null && opts.length() == 4) {
                                  val options = (0 until 4).map { opts.optString(it, "").trim() }
                                  if (options.none { it.isBlank() }) {
                                      val ans = obj.optInt("ans", 0).coerceIn(0, 3)
                                      val exp = obj.optString("exp", "").trim().ifBlank { "Correct Answer: ${options[ans]}" }
                                      list.add(Question(
                                          obj.optString("topic", "General"), 
                                          obj.optString("type", "gs"), 
                                          obj.optString("exam", ""), 
                                          q, 
                                          options, 
                                          ans, 
                                          exp
                                      ))
                                  }
                              }
                          } catch (_: Exception) {}
                      }
                      list
                  } catch (e: Exception) { throw Exception("JSON Parsing Failed.") }
              }

              fun validateQuestion(q: Question): Boolean {
                  if (q.q.isBlank() || q.options.size != 4 || q.options.any { it.isBlank() } || q.options.distinct().size != 4) return false
                  if (q.ans !in 0..3 || q.q.length < 8) return false
                  return true
              }
              private fun dedupe(qs: List<Question>): List<Question> { val seen = HashSet<String>(); val out = mutableListOf<Question>(); for (q in qs) if (seen.add(normKey(q.q))) out.add(q); return out }
              private fun normKey(text: String) = text.lowercase().replace(Regex("<[^>]+>"), "").replace(Regex("[\\s\\p{Punct}]+"), "").trim()
              private fun chunkText(text: String, maxChars: Int): List<String> {
                  if (text.length <= maxChars) return listOf(text)
                  val chunks = mutableListOf<String>(); var start = 0
                  while (start < text.length) {
                      var end = minOf(start + maxChars, text.length); if (end < text.length) { val nl = text.lastIndexOf('\n', end); if (nl > start + maxChars / 2) end = nl }
                      chunks.add(text.substring(start, end)); start = end
                  }
                  return chunks
              }
          }
          EOF

          # --- 8. PackExporter.kt ---
          cat << 'EOF' > $BASE_DIR/PackExporter.kt
          package com.example.hindiscan
          import android.content.Context
          import android.net.Uri
          import androidx.documentfile.provider.DocumentFile
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import kotlinx.serialization.encodeToString
          import kotlinx.serialization.json.Json
          import org.json.JSONArray
          import java.io.BufferedOutputStream
          import java.io.File
          import java.io.FileOutputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.zip.ZipEntry
          import java.util.zip.ZipOutputStream
          
          class PackExporter(private val context: Context) {
              private val json = Json { prettyPrint = true; encodeDefaults = true }
              
              suspend fun generateJson(questions: List<Question>): Pair<String, Map<String, String>> = withContext(Dispatchers.IO) {
                  require(questions.isNotEmpty()) { "No questions available." }
                  val timestamp = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())
                  val baseName = "HindiScan_${timestamp}"
                  val masterJson = json.encodeToString(questions); JSONArray(masterJson)
                  val files = linkedMapOf<String, String>()
                  files["${baseName}_Master_${questions.size}Q.json"] = masterJson
                  Pair(baseName, files)
              }

              suspend fun saveToSelectedFolder(folderUri: Uri, baseName: String, files: Map<String, String>): Boolean = withContext(Dispatchers.IO) {
                  try {
                      val root = DocumentFile.fromTreeUri(context, folderUri) ?: return@withContext false
                      val zipFile = File(context.cacheDir, "$baseName.zip")
                      ZipOutputStream(BufferedOutputStream(FileOutputStream(zipFile))).use { zos ->
                          for ((name, content) in files) {
                              zos.putNextEntry(ZipEntry(name)); zos.write(content.toByteArray(Charsets.UTF_8)); zos.closeEntry()
                          }
                      }
                      for ((name, content) in files) {
                          val file = root.createFile("application/json", name)
                          file?.uri?.let { uri -> context.contentResolver.openOutputStream(uri)?.use { it.write(content.toByteArray(Charsets.UTF_8)) } }
                      }
                      val zipDoc = root.createFile("application/zip", "$baseName.zip")
                      zipDoc?.uri?.let { uri -> context.contentResolver.openOutputStream(uri)?.use { zipFile.inputStream().copyTo(it) } }
                      zipFile.delete()
                      return@withContext true
                  } catch (e: Exception) { e.printStackTrace(); return@withContext false }
              }
          }
          EOF

          # --- 9. UpdateChecker.kt ---
          cat << 'EOF' > $BASE_DIR/UpdateChecker.kt
          package com.example.hindiscan
          import android.app.DownloadManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.net.Uri
          import android.os.Build
          import android.os.Environment
          import androidx.core.content.FileProvider
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject
          import java.io.File

          class UpdateChecker(private val context: Context) {
              private val GITHUB_REPO = "ramveersingh999-dot/Hindi-JSON-"
              
              suspend fun checkForUpdate(): Pair<String, String>? = withContext(Dispatchers.IO) {
                  try {
                      val url = "https://api.github.com/repos/$GITHUB_REPO/releases/latest"
                      val request = Request.Builder().url(url).build()
                      val client = OkHttpClient()
                      client.newCall(request).execute().use { response ->
                          if (!response.isSuccessful) return@withContext null
                          val body = response.body?.string() ?: return@withContext null
                          val json = JSONObject(body)
                          val latestVersion = json.getString("tag_name")
                          val downloadUrl = json.getJSONArray("assets").getJSONObject(0).getString("browser_download_url")
                          
                          val currentVersion = "v${BuildConfig.VERSION_NAME}"
                          if (latestVersion != currentVersion) {
                              return@withContext Pair(latestVersion, downloadUrl)
                          }
                      }
                  } catch (e: Exception) { e.printStackTrace() }
                  return@withContext null
              }

              fun downloadAndInstall(url: String) {
                  val request = DownloadManager.Request(Uri.parse(url))
                      .setTitle("HindiScan Update")
                      .setDescription("Downloading new version...")
                      .setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED)
                      .setDestinationInExternalFilesDir(context, Environment.DIRECTORY_DOWNLOADS, "update.apk")
                      .setMimeType("application/vnd.android.package-archive")

                  val downloadManager = context.getSystemService(Context.DOWNLOAD_SERVICE) as DownloadManager
                  val downloadId = downloadManager.enqueue(request)

                  val onDownloadComplete = object : BroadcastReceiver() {
                      override fun onReceive(context: Context, intent: Intent) {
                          val id = intent.getLongExtra(DownloadManager.EXTRA_DOWNLOAD_ID, -1)
                          if (id == downloadId) {
                              val file = File(context.getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS), "update.apk")
                              val apkUri: Uri = FileProvider.getUriForFile(context, "${context.packageName}.fileprovider", file)
                              val installIntent = Intent(Intent.ACTION_VIEW).apply {
                                  setDataAndType(apkUri, "application/vnd.android.package-archive")
                                  addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                                  addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                              }
                              context.startActivity(installIntent)
                          }
                      }
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      context.registerReceiver(onDownloadComplete, IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE), Context.RECEIVER_EXPORTED)
                  } else {
                      context.registerReceiver(onDownloadComplete, IntentFilter(DownloadManager.ACTION_DOWNLOAD_COMPLETE))
                  }
              }
          }
          EOF

          # --- 10. ScanViewModel.kt ---
          cat << 'EOF' > $BASE_DIR/ScanViewModel.kt
          package com.example.hindiscan
          import android.app.Activity
          import android.app.Application
          import android.content.Intent
          import android.net.Uri
          import androidx.activity.result.IntentSenderRequest
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import com.google.mlkit.vision.documentscanner.GmsDocumentScannerOptions
          import com.google.mlkit.vision.documentscanner.GmsDocumentScanning
          import com.google.mlkit.vision.documentscanner.GmsDocumentScanningResult
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.Job
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import kotlinx.serialization.encodeToString
          import kotlinx.serialization.json.Json

          class ScanViewModel(app: Application) : AndroidViewModel(app) {
              private val ocr = OcrEngine(app); private val exporter = PackExporter(app); val store = AppStore(app)
              private val updateChecker = UpdateChecker(app)
              private val _state = MutableStateFlow(ScanUiState()); val state = _state.asStateFlow()
              private var processingJob: Job? = null
              var currentGeneratedFiles: Map<String, String> = emptyMap()
              var currentBaseName: String = ""

              init {
                  viewModelScope.launch {
                      val updateInfo = updateChecker.checkForUpdate()
                      if (updateInfo != null) {
                          _state.value = _state.value.copy(updateUrl = updateInfo.second, updateVersion = updateInfo.first)
                      }
                  }
              }

              fun triggerUpdate() {
                  val url = _state.value.updateUrl ?: return
                  updateChecker.downloadAndInstall(url)
                  _state.value = _state.value.copy(updateUrl = null)
              }

              fun dismissUpdate() { _state.value = _state.value.copy(updateUrl = null) }

              fun startScanner(activity: Activity, launch: (IntentSenderRequest) -> Unit) {
                  val options = GmsDocumentScannerOptions.Builder().setGalleryImportAllowed(true).setPageLimit(200)
                      .setResultFormats(GmsDocumentScannerOptions.RESULT_FORMAT_JPEG, GmsDocumentScannerOptions.RESULT_FORMAT_PDF)
                      .setScannerMode(GmsDocumentScannerOptions.SCANNER_MODE_FULL).build()
                  GmsDocumentScanning.getClient(options).getStartScanIntent(activity)
                      .addOnSuccessListener { launch(IntentSenderRequest.Builder(it).build()) }
                      .addOnFailureListener { e -> _state.value = _state.value.copy(error = "Scanner Error: ${e.message}") }
              }
              fun onPdfSelected(uri: Uri) { _state.value = ScanUiState(pendingUris = listOf(uri)) }
              fun onScanResult(data: Intent?) {
                  val result = GmsDocumentScanningResult.fromActivityResultIntent(data) ?: return
                  val uris = mutableListOf<Uri>(); result.pages?.forEach { uris.add(it.imageUri) }; result.pdf?.let { uris.add(it.uri) }
                  if (uris.isEmpty()) { _state.value = _state.value.copy(error = "No pages found."); return }
                  _state.value = ScanUiState(pendingUris = uris)
              }
              
              fun processWithLanguage(targetLang: String) {
                  val uris = _state.value.pendingUris ?: return; val keys = store.getKeys()
                  if (keys.gemini.isBlank() && keys.groq.isBlank() && keys.openai.isBlank()) { 
                      _state.value = _state.value.copy(error = "Please set at least one API Key.", pendingUris = null) 
                      return 
                  }
                  _state.value = _state.value.copy(pendingUris = null)
                  runProcessing(uris, targetLang, keys)
              }

              private fun runProcessing(uris: List<Uri>, targetLang: String, keys: ApiKeys) {
                  processingJob = viewModelScope.launch {
                      _state.value = _state.value.copy(isProcessing = true, error = null, progressText = "Starting OCR...", progress = 0f)
                      try {
                          val sb = StringBuilder()
                          uris.forEachIndexed { idx, uri ->
                              _state.value = _state.value.copy(progressText = "Scanning document (${idx + 1}/${uris.size})...", progress = (idx.toFloat() / uris.size) * 0.15f)
                              sb.append(ocr.recognize(uri)).append("\n\n")
                          }
                          val ocrText = sb.toString()
                          if (ocrText.isBlank()) throw Exception("OCR returned empty text. Image may be unclear.")
                          
                          val questions = withContext(Dispatchers.IO) { AiProcessor(keys).process(ocrText, targetLang) { msg, prog -> _state.value = _state.value.copy(progressText = msg, progress = 0.15f + prog * 0.85f) } }
                          if (questions.isEmpty()) throw Exception("AI could not extract any valid questions.")
                          
                          val jsonStr = Json { prettyPrint = true; encodeDefaults = true }.encodeToString(questions)
                          val (baseName, files) = exporter.generateJson(questions)
                          currentBaseName = baseName
                          currentGeneratedFiles = files
                          
                          _state.value = _state.value.copy(questions = questions, rawJson = jsonStr, progressText = "Done: ${questions.size} questions", progress = 1f, isProcessing = false)
                      } catch (e: Exception) { 
                          if (e is kotlinx.coroutines.CancellationException) {
                              _state.value = _state.value.copy(isProcessing = false, error = "Processing cancelled.")
                          } else {
                              _state.value = _state.value.copy(isProcessing = false, error = e.message ?: "Unknown Error") 
                          }
                      }
                  }
              }

              fun saveToFolder(folderUri: Uri) {
                  viewModelScope.launch {
                      _state.value = _state.value.copy(progressText = "Saving files...", isProcessing = true)
                      val success = exporter.saveToSelectedFolder(folderUri, currentBaseName, currentGeneratedFiles)
                      _state.value = _state.value.copy(
                          isProcessing = false, 
                          savedMsg = if (success) "✓ Files saved to selected folder!" else "Failed to save files."
                      )
                  }
              }

              fun cancelProcessing() { 
                  processingJob?.cancel(); processingJob = null; 
                  _state.value = _state.value.copy(isProcessing = false, pendingUris = null, error = "Processing cancelled.") 
              }
              fun cancelSelection() { _state.value = _state.value.copy(pendingUris = null) }
              override fun onCleared() { super.onCleared(); ocr.close() }
          }
          EOF

          # --- 11. MainActivity.kt ---
