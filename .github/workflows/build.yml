name: Build HindiScan APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip Project Files
        run: |
          unzip Project.zip -d project_folder

      - name: Generate All Perfect Code Files
        run: |
          cd project_folder
          BASE_DIR="app/src/main/java/com/example/hindiscan"
          mkdir -p $BASE_DIR
          
          # 1. AndroidManifest.xml
          mkdir -p app/src/main
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
              <application
                  android:allowBackup="true"
                  android:label="HindiScan"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="com.google.mlkit.vision.DEPENDENCIES"
                      android:value="ocr" />
              </application>
          </manifest>
          EOF

          # 2. app/build.gradle.kts
          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.serialization")
          }
          android {
              namespace = "com.example.hindiscan"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.hindiscan"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.8" }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              packaging { resources.excludes += "/META-INF/{AL2.0,LGPL2.1}" }
          }
          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.7.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0")
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.compose.foundation:foundation")
              implementation("com.google.android.gms:play-services-mlkit-document-scanner:16.0.0-beta1")
              implementation("com.google.mlkit:text-recognition:16.0.0")
              implementation("com.google.mlkit:text-recognition-devanagari:16.0.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("androidx.security:security-crypto:1.1.0-alpha06")
          }
          EOF

          # 3. Models.kt
          cat << 'EOF' > $BASE_DIR/Models.kt
          package com.example.hindiscan
          import kotlinx.serialization.Serializable
          import android.net.Uri

          @Serializable
          data class Question(
              val topic: String = "General",
              val type: String = "hindi",
              val year: String = "",
              val board: String = "",
              val q: String = "",
              val options: List<String> = emptyList(),
              val ans: Int = 0,
              val exp: String = ""
          )

          @Serializable
          data class Subject(val name: String, val topic: String, val type: String)

          data class ScanUiState(
              val isProcessing: Boolean = false,
              val progressText: String = "",
              val progress: Float = 0f,
              val questions: List<Question> = emptyList(),
              val rawJson: String = "",
              val error: String? = null,
              val savedMsg: String? = null,
              val pendingUris: List<Uri>? = null
          )

          data class ExportResult(val folderName: String, val fileCount: Int, val questionCount: Int, val partCount: Int, val zipName: String)
          EOF

          # 4. Theme.kt
          cat << 'EOF' > $BASE_DIR/Theme.kt
          package com.example.hindiscan
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color

          private val PremiumDark = darkColorScheme(
              primary = Color(0xFF9D7BFF), onPrimary = Color(0xFF1A0033), primaryContainer = Color(0xFF3D2E66),
              onPrimaryContainer = Color(0xFFE8DDFF), secondary = Color(0xFF7DD3C0), onSecondary = Color(0xFF00382E),
              secondaryContainer = Color(0xFF1F4D44), onSecondaryContainer = Color(0xFFB8F0E2), tertiary = Color(0xFFFFB86C),
              background = Color(0xFF0D0D14), onBackground = Color(0xFFE6E1E6), surface = Color(0xFF16161F),
              onSurface = Color(0xFFE6E1E6), surfaceVariant = Color(0xFF23232E), onSurfaceVariant = Color(0xFFB8B4C0),
              outline = Color(0xFF4A4A57), error = Color(0xFFFF6B6B), onError = Color(0xFF370001)
          )

          @Composable
          fun HindiScanTheme(content: @Composable () -> Unit) {
              MaterialTheme(colorScheme = PremiumDark, content = content)
          }
          EOF

          # 5. AppStore.kt
          cat << 'EOF' > $BASE_DIR/AppStore.kt
          package com.example.hindiscan
          import android.content.Context
          import androidx.security.crypto.EncryptedSharedPreferences
          import androidx.security.crypto.MasterKey
          import kotlinx.serialization.encodeToString
          import kotlinx.serialization.json.Json

          class AppStore(context: Context) {
              private val prefs = EncryptedSharedPreferences.create(
                  context, "secure_prefs",
                  MasterKey.Builder(context).setKeyScheme(MasterKey.KeyScheme.AES256_GCM).build(),
                  EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
                  EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM
              )
              fun getKey(): String = prefs.getString("gemini_key", "") ?: ""
              fun saveKey(key: String) = prefs.edit().putString("gemini_key", key.trim()).apply()
              fun clearKey() = prefs.edit().remove("gemini_key").apply()

              private val defaultSubjects = listOf(
                  Subject("हिंदी साहित्य", "हिंदी साहित्य", "hindi"),
                  Subject("हिंदी व्याकरण", "हिंदी व्याकरण", "hindi"),
                  Subject("संस्कृत व्याकरण", "संस्कृत व्याकरण", "sanskrit"),
                  Subject("इतिहास", "इतिहास", "gs"),
                  Subject("सामान्य ज्ञान", "सामान्य ज्ञान", "gs")
              )
              fun getSubjects(): List<Subject> {
                  val custom = prefs.getString("custom_subjects", "") ?: ""
                  if (custom.isBlank()) return defaultSubjects
                  return try {
                      defaultSubjects + Json { ignoreUnknownKeys = true }.decodeFromString<List<Subject>>(custom)
                  } catch (_: Exception) { defaultSubjects }
              }
              fun saveCustomSubject(subject: Subject) {
                  val customOnly = getSubjects().drop(defaultSubjects.size).toMutableList()
                  customOnly.add(subject)
                  prefs.edit().putString("custom_subjects", Json.encodeToString(customOnly)).apply()
              }
          }
          EOF

          # 6. OcrEngine.kt
          cat << 'EOF' > $BASE_DIR/OcrEngine.kt
          package com.example.hindiscan
          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.pdf.PdfRenderer
          import android.net.Uri
          import android.os.ParcelFileDescriptor
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.text.TextRecognition
          import com.google.mlkit.vision.text.TextRecognizer
          import com.google.mlkit.vision.text.devanagari.DevanagariTextRecognizerOptions
          import com.google.mlkit.vision.text.latin.TextRecognizerOptions
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.suspendCancellableCoroutine
          import kotlinx.coroutines.withContext
          import kotlin.coroutines.resume
          import kotlin.coroutines.resumeWithException

          class OcrEngine(private val context: Context) {
              private val devanagari: TextRecognizer = TextRecognition.getClient(DevanagariTextRecognizerOptions.Builder().build())
              private val latin: TextRecognizer = TextRecognition.getClient(TextRecognizerOptions.DEFAULT_OPTIONS)

              suspend fun recognize(uri: Uri): String {
                  val mime = context.contentResolver.getType(uri)
                  return if (mime == "application/pdf") recognizePdf(uri) else recognizeImage(uri)
              }
              private suspend fun recognizeImage(uri: Uri): String {
                  val image = InputImage.fromFilePath(context, uri)
                  val dev = runRecognizer(devanagari, image)
                  val lat = runRecognizer(latin, image)
                  return pickBest(dev, lat)
              }
              private suspend fun recognizePdf(uri: Uri): String = withContext(Dispatchers.IO) {
                  val sb = StringBuilder()
                  var pfd: ParcelFileDescriptor? = null
                  var renderer: PdfRenderer? = null
                  try {
                      pfd = context.contentResolver.openFileDescriptor(uri, "r")
                      if (pfd != null) {
                          renderer = PdfRenderer(pfd)
                          for (i in 0 until renderer.pageCount) {
                              renderer.openPage(i).use { page ->
                                  val bmp = Bitmap.createBitmap(page.width * 2, page.height * 2, Bitmap.Config.ARGB_8888)
                                  bmp.eraseColor(Color.WHITE)
                                  page.render(bmp, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY)
                                  val img = InputImage.fromBitmap(bmp, 0)
                                  sb.append(pickBest(runRecognizer(devanagari, img), runRecognizer(latin, img))).append("\n\n")
                                  bmp.recycle()
                              }
                          }
                      }
                  } catch (_: Exception) {} finally { renderer?.close(); pfd?.close() }
                  sb.toString()
              }
              private suspend fun runRecognizer(rec: TextRecognizer, image: InputImage): String = suspendCancellableCoroutine { cont ->
                  rec.process(image).addOnSuccessListener { cont.resume(it.text) }.addOnFailureListener { cont.resumeWithException(it) }
              }
              private fun pickBest(devText: String, latText: String): String {
                  val devCount = devText.count { it in '\u0900'..'\u097F' }
                  val latCount = latText.count { it.isLetter() && it !in '\u0900'..'\u097F' }
                  return if (devCount >= latCount) devText else latText
              }
              fun close() { devanagari.close(); latin.close() }
          }
          EOF

          # 7. AiProcessor.kt
          cat << 'EOF' > $BASE_DIR/AiProcessor.kt
          package com.example.hindiscan
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import kotlinx.serialization.encodeToString
          import kotlinx.serialization.json.Json
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.util.concurrent.TimeUnit

          class AiProcessor(private val apiKey: String) {
              private val http = OkHttpClient.Builder().connectTimeout(60, TimeUnit.SECONDS).readTimeout(300, TimeUnit.SECONDS).build()
              private val json = Json { ignoreUnknownKeys = true; encodeDefaults = true }
              private val models = listOf("gemini-2.0-flash-exp", "gemini-1.5-flash-latest", "gemini-1.5-pro-latest")

              suspend fun process(ocrText: String, subject: Subject, onProgress: (String, Float) -> Unit): List<Question> = withContext(Dispatchers.IO) {
                  if (apiKey.isBlank()) throw IllegalStateException("API Key सेट नहीं है।")
                  if (ocrText.isBlank()) return@withContext emptyList()
                  val chunks = chunkText(ocrText, 14000)
                  val extracted = mutableListOf<Question>()
                  chunks.forEachIndexed { idx, chunk ->
                      onProgress("AI विश्लेषण भाग ${idx + 1}/${chunks.size}…", (idx.toFloat() / chunks.size) * 0.5f)
                      try { extracted += extractChunk(chunk, subject) } catch (_: Exception) {}
                  }
                  val deduped = dedupe(extracted)
                  onProgress("${deduped.size} अद्वितीय प्रश्न मिले — सत्यापन…", 0.55f)
                  val verified = mutableListOf<Question>()
                  val batches = deduped.chunked(12)
                  batches.forEachIndexed { idx, batch ->
                      onProgress("सत्यापन ${idx + 1}/${batches.size}…", 0.55f + (idx.toFloat() / batches.size) * 0.45f)
                      try { verified += verifyBatch(batch) } catch (_: Exception) { verified += batch.filter { validateQuestion(it) } }
                  }
                  val finalList = verified.filter { validateQuestion(it) }.distinctBy { normKey(it.q) }
                  onProgress("पूर्ण: ${finalList.size} प्रश्न सत्यापित", 1f)
                  finalList
              }

              private fun buildExtractPrompt(chunk: String, subject: Subject): String = """
                  You are a senior Hindi/Sanskrit language expert. Extract EVERY authentic question from OCR text.
                  Rules: 1. Sanskrit -> Sanskrit. 2. Hindi -> Hindi. 3. English -> Pure Hindi.
                  4. ILLEGIBLE -> SKIP. 5. NO duplicates. 6. Match questions -> HTML table.
                  7. REMOVE answer leaks. 8. Exactly 4 UNIQUE options. 9. ans = 0..3 (Int).
                  10. Output ONLY valid JSON array.
                  Fixed: topic="${subject.topic}", type="${subject.type}".
                  JSON format: [ { "topic": "${subject.topic}", "type": "${subject.type}", "year": "2021", "board": "UP PGT", "q": "Question", "options": ["A","B","C","D"], "ans": 0, "exp": "Explanation" } ]
                  OCR TEXT: $chunk
              """.trimIndent()

              private fun extractChunk(chunk: String, subject: Subject): List<Question> = parseQuestions(callGemini(buildExtractPrompt(chunk, subject)))
              private fun verifyBatch(batch: List<Question>): List<Question> {
                  val prompt = """
                      You are a senior Hindi language auditor. FIX and FILTER this JSON array.
                      1. Correct spelling/grammar. 2. Translate English to Hindi. 3. Keep Sanskrit.
                      4. Remove answer leaks. 5. Exactly 4 unique options. 6. ans must be 0..3.
                      7. Remove meaningless questions. 8. Output ONLY the JSON array of APPROVED questions.
                      INPUT: ${json.encodeToString(batch)}
                  """.trimIndent()
                  return parseQuestions(callGemini(prompt))
              }

              private fun callGemini(prompt: String): String {
                  for (model in models) {
                      try {
                          val url = "https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent?key=$apiKey"
                          val payload = JSONObject().put("contents", JSONArray().put(JSONObject().put("parts", JSONArray().put(JSONObject().put("text", prompt)))))
                              .put("generationConfig", JSONObject().put("temperature", 0.05).put("maxOutputTokens", 8192).put("responseMimeType", "application/json")).toString()
                          val req = Request.Builder().url(url).post(payload.toRequestBody("application/json".toMediaType())).build()
                          http.newCall(req).execute().use { resp ->
                              if (resp.isSuccessful) {
                                  val text = JSONObject(resp.body!!.string()).optJSONArray("candidates")?.optJSONObject(0)?.optJSONObject("content")?.optJSONArray("parts")?.optJSONObject(0)?.optString("text") ?: ""
                                  if (text.isNotBlank()) return text
                              }
                          }
                      } catch (_: Exception) {}
                  }
                  throw Exception("AI model call failed")
              }

              private fun parseQuestions(raw: String): List<Question> {
                  var cleaned = raw.trim().replace("```json", "").replace("```", "").trim()
                  val start = cleaned.indexOf('['); val end = cleaned.lastIndexOf(']')
                  if (start == -1 || end == -1 || end <= start) return emptyList()
                  cleaned = cleaned.substring(start, end + 1)
                  return try {
                      val arr = JSONArray(cleaned)
                      val list = mutableListOf<Question>()
                      for (i in 0 until arr.length()) {
                          try {
                              val obj = arr.getJSONObject(i)
                              val q = obj.optString("q", "").trim()
                              val opts = obj.optJSONArray("options")
                              if (q.isNotBlank() && opts != null && opts.length() == 4) {
                                  val options = (0 until 4).map { opts.optString(it, "").trim() }
                                  if (options.none { it.isBlank() }) {
                                      list.add(Question(obj.optString("topic", "General"), obj.optString("type", "hindi"), obj.optString("year", ""), obj.optString("board", ""), q, options, obj.optInt("ans", 0).coerceIn(0, 3), obj.optString("exp", "")))
                                  }
                              }
                          } catch (_: Exception) {}
                      }
                      list
                  } catch (_: Exception) { emptyList() }
              }

              fun validateQuestion(q: Question): Boolean {
                  if (q.q.isBlank() || q.options.size != 4 || q.options.any { it.isBlank() } || q.options.distinct().size != 4) return false
                  if (q.ans !in 0..3 || q.exp.isBlank() || q.q.length < 8) return false
                  val leak = Regex("(उत्तर|answer|Ans)\\s*[:：]?\\s*[A-D1-4]", RegexOption.IGNORE_CASE)
                  if (q.options.filterIndexed { i, _ -> i != q.ans }.any { leak.containsMatchIn(it) }) return false
                  return true
              }

              private fun dedupe(qs: List<Question>): List<Question> {
                  val seen = HashSet<String>(); val out = mutableListOf<Question>()
                  for (q in qs) if (seen.add(normKey(q.q))) out.add(q)
                  return out
              }
              private fun normKey(text: String) = text.lowercase().replace(Regex("<[^>]+>"), "").replace(Regex("[\\s\\p{Punct}]+"), "").trim()
              private fun chunkText(text: String, maxChars: Int): List<String> {
                  if (text.length <= maxChars) return listOf(text)
                  val chunks = mutableListOf<String>(); var start = 0
                  while (start < text.length) {
                      var end = minOf(start + maxChars, text.length)
                      if (end < text.length) { val nl = text.lastIndexOf('\n', end); if (nl > start + maxChars / 2) end = nl }
                      chunks.add(text.substring(start, end)); start = end
                  }
                  return chunks
              }
          }
          EOF

          # 8. PackExporter.kt
          cat << 'EOF' > $BASE_DIR/PackExporter.kt
          package com.example.hindiscan
          import android.content.ContentValues
          import android.content.Context
          import android.os.Build
          import android.os.Environment
          import android.provider.MediaStore
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import kotlinx.serialization.encodeToString
          import kotlinx.serialization.json.Json
          import org.json.JSONArray
          import java.io.BufferedOutputStream
          import java.io.File
          import java.io.FileOutputStream
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale
          import java.util.zip.ZipEntry
          import java.util.zip.ZipOutputStream

          class PackExporter(private val context: Context) {
              private val json = Json { prettyPrint = true; encodeDefaults = true }
              suspend fun export(questions: List<Question>, batchLabel: String = "Batch01"): ExportResult = withContext(Dispatchers.IO) {
                  require(questions.isNotEmpty()) { "कोई प्रश्न नहीं" }
                  val timestamp = SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date())
                  val baseName = "HindiScan_${batchLabel}_${timestamp}"
                  val masterJson = json.encodeToString(questions)
                  JSONArray(masterJson) // Validate
                  val files = linkedMapOf<String, String>()
                  files["${baseName}_Master_${questions.size}Q.json"] = masterJson
                  val parts = if (questions.size > 900) questions.chunked(850) else emptyList()
                  parts.forEachIndexed { idx, chunk -> files["${baseName}_Part_${String.format("%02d", idx + 1)}_${chunk.size}Q.json"] = json.encodeToString(chunk) }
                  
                  writeToDownloads("${baseName}_Pack", baseName, files)
                  ExportResult("Downloads/HindiScan_Packs/${baseName}_Pack", files.size + 1, questions.size, parts.size, "$baseName.zip")
              }

              private fun writeToDownloads(folderName: String, baseName: String, files: Map<String, String>) {
                  val zipFile = File(context.cacheDir, "$baseName.zip")
                  ZipOutputStream(BufferedOutputStream(FileOutputStream(zipFile))).use { zos ->
                      for ((name, content) in files) {
                          zos.putNextEntry(ZipEntry(name)); zos.write(content.toByteArray(Charsets.UTF_8)); zos.closeEntry()
                      }
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      val downloads = MediaStore.Downloads.getContentUri(MediaStore.VOLUME_EXTERNAL_PRIMARY)
                      val relFolder = "${Environment.DIRECTORY_DOWNLOADS}/HindiScan_Packs/$folderName"
                      for ((name, content) in files) {
                          val values = ContentValues().apply {
                              put(MediaStore.MediaColumns.DISPLAY_NAME, name); put(MediaStore.MediaColumns.MIME_TYPE, "application/json"); put(MediaStore.MediaColumns.RELATIVE_PATH, relFolder)
                          }
                          context.contentResolver.insert(downloads, values)?.let { uri ->
                              context.contentResolver.openOutputStream(uri)?.use { it.write(content.toByteArray(Charsets.UTF_8)) }
                          }
                      }
                      val zipValues = ContentValues().apply {
                          put(MediaStore.MediaColumns.DISPLAY_NAME, "$baseName.zip"); put(MediaStore.MediaColumns.MIME_TYPE, "application/zip"); put(MediaStore.MediaColumns.RELATIVE_PATH, "${Environment.DIRECTORY_DOWNLOADS}/HindiScan_Packs")
                      }
                      context.contentResolver.insert(downloads, zipValues)?.let { uri ->
                          context.contentResolver.openOutputStream(uri)?.use { zipFile.inputStream().copyTo(it) }
                      }
                  } else {
                      @Suppress("DEPRECATION") val base = File(Environment.getExternalStoragePublicDirectory(Environment.DIRECTORY_DOWNLOADS), "HindiScan_Packs").apply { mkdirs() }
                      val folder = File(base, folderName).apply { mkdirs() }
                      for ((name, content) in files) File(folder, name).writeText(content, Charsets.UTF_8)
                      File(base, "$baseName.zip").writeBytes(zipFile.readBytes())
                  }
                  zipFile.delete()
              }
          }
          EOF

          # 9. ScanViewModel.kt
          cat << 'EOF' > $BASE_DIR/ScanViewModel.kt
          package com.example.hindiscan
          import android.app.Activity
          import android.app.Application
          import android.content.Intent
          import android.net.Uri
          import androidx.activity.result.IntentSenderRequest
          import androidx.lifecycle.AndroidViewModel
          import androidx.lifecycle.viewModelScope
          import com.google.mlkit.vision.documentscanner.GmsDocumentScannerOptions
          import com.google.mlkit.vision.documentscanner.GmsDocumentScanning
          import com.google.mlkit.vision.documentscanner.GmsDocumentScanningResult
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.launch
          import kotlinx.coroutines.withContext
          import kotlinx.serialization.encodeToString
          import kotlinx.serialization.json.Json

          class ScanViewModel(app: Application) : AndroidViewModel(app) {
              private val ocr = OcrEngine(app); private val exporter = PackExporter(app); val store = AppStore(app)
              private val _state = MutableStateFlow(ScanUiState()); val state = _state.asStateFlow()
              fun startScanner(activity: Activity, launch: (IntentSenderRequest) -> Unit) {
                  val options = GmsDocumentScannerOptions.Builder().setGalleryImportAllowed(true).setPageLimit(200)
                      .setResultFormats(GmsDocumentScannerOptions.RESULT_FORMAT_JPEG, GmsDocumentScannerOptions.RESULT_FORMAT_PDF)
                      .setScannerMode(GmsDocumentScannerOptions.SCANNER_MODE_FULL).build()
                  GmsDocumentScanning.getClient(options).getStartScanIntent(activity)
                      .addOnSuccessListener { launch(IntentSenderRequest.Builder(it).build()) }
                      .addOnFailureListener { e -> _state.value = _state.value.copy(error = "स्कैनर त्रुटि: ${e.message}") }
              }
              fun onScanResult(data: Intent?) {
                  val result = GmsDocumentScanningResult.fromActivityResultIntent(data) ?: return
                  val uris = mutableListOf<Uri>(); result.pages?.forEach { uris.add(it.imageUri) }; result.pdf?.let { uris.add(it.uri) }
                  if (uris.isEmpty()) { _state.value = _state.value.copy(error = "कोई पृष्ठ नहीं मिला।"); return }
                  _state.value = _state.value.copy(pendingUris = uris)
              }
              fun processWithSubject(subject: Subject) {
                  val uris = _state.value.pendingUris ?: return; val apiKey = store.getKey()
                  if (apiKey.isBlank()) { _state.value = _state.value.copy(pendingUris = null, error = "पहले ⚙ API सेटिंग्स में Gemini API Key जोड़ें।"); return }
                  viewModelScope.launch {
                      _state.value = ScanUiState(isProcessing = true, progressText = "OCR शुरू…")
                      try {
                          val sb = StringBuilder()
                          uris.forEachIndexed { idx, uri ->
                              _state.value = _state.value.copy(progressText = "OCR: पृष्ठ ${idx + 1}/${uris.size}", progress = (idx.toFloat() / uris.size) * 0.15f)
                              sb.append(ocr.recognize(uri)).append("\n\n")
                          }
                          val ocrText = sb.toString()
                          if (ocrText.isBlank()) { _state.value = ScanUiState(error = "OCR से कोई टेक्स्ट नहीं मिला।"); return@launch }
                          val questions = withContext(Dispatchers.IO) { AiProcessor(apiKey).process(ocrText, subject) { msg, prog -> _state.value = _state.value.copy(progressText = msg, progress = 0.15f + prog * 0.85f) } }
                          if (questions.isEmpty()) { _state.value = ScanUiState(error = "कोई मान्य प्रश्न नहीं मिला।"); return@launch }
                          val jsonStr = Json { prettyPrint = true; encodeDefaults = true }.encodeToString(questions)
                          _state.value = ScanUiState(questions = questions, rawJson = jsonStr, progressText = "तैयार: ${questions.size} प्रश्न", progress = 1f)
                      } catch (e: Exception) { _state.value = ScanUiState(error = e.message ?: "अज्ञात त्रुटि") }
                  }
              }
              fun export() {
                  val questions = _state.value.questions
                  if (questions.isEmpty()) { _state.value = _state.value.copy(error = "पहले कोई दस्तावेज़ स्कैन करें।"); return }
                  viewModelScope.launch {
                      try {
                          val result = exporter.export(questions)
                          _state.value = _state.value.copy(savedMsg = "✓ ${result.questionCount} प्रश्न, ${result.fileCount} फ़ाइलें → ${result.folderName}")
                      } catch (e: Exception) { _state.value = _state.value.copy(error = "सेव विफल: ${e.message}") }
                  }
              }
              fun cancelSelection() { _state.value = _state.value.copy(pendingUris = null) }
              override fun onCleared() { super.onCleared(); ocr.close() }
          }
          EOF

          # 10. MainActivity.kt
          cat << 'EOF' > $BASE_DIR/MainActivity.kt
          package com.example.hindiscan
          import android.app.Activity
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.activity.viewModels
          import androidx.compose.runtime.*

          class MainActivity : ComponentActivity() {
              private val vm: ScanViewModel by viewModels()
              private val launcher = registerForActivityResult(ActivityResultContracts.StartIntentSenderForResult()) { r ->
                  if (r.resultCode == Activity.RESULT_OK) vm.onScanResult(r.data)
              }
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      HindiScanTheme {
                          val state by vm.state.collectAsState()
                          var currentKey by remember { mutableStateOf(vm.store.getKey()) }
                          var subjects by remember { mutableStateOf(vm.store.getSubjects()) }
                          ScanScreen(
                              state = state, apiKey = currentKey, subjects = subjects,
                              onStartScan = { vm.startScanner(this) { launcher.launch(it) } },
                              onSaveKey = { currentKey = it; vm.store.saveKey(it) },
                              onRemoveKey = { currentKey = ""; vm.store.clearKey() },
                              onExport = { vm.export() },
                              onSubjectSelected = { vm.processWithSubject(it) },
                              onCancelSelection = { vm.cancelSelection() },
                              onAddSubject = { sub -> vm.store.saveCustomSubject(sub); subjects = vm.store.getSubjects() }
                          )
                      }
                  }
              }
          }
          EOF

          # 11. MainScreen.kt
          cat << 'EOF' > $BASE_DIR/MainScreen.kt
          package com.example.hindiscan
          import androidx.compose.foundation.background
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.foundation.text.selection.SelectionContainer
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun ScanScreen(
              state: ScanUiState, apiKey: String, subjects: List<Subject>,
              onStartScan: () -> Unit, onSaveKey: (String) -> Unit, onRemoveKey: () -> Unit,
              onExport: () -> Unit, onSubjectSelected: (Subject) -> Unit, onCancelSelection: () -> Unit, onAddSubject: (Subject) -> Unit
          ) {
              var showSettings by remember { mutableStateOf(false) }
              var showAddSubject by remember { mutableStateOf(false) }

              if (showSettings) {
                  var keyInput by remember { mutableStateOf(apiKey) }
                  AlertDialog(
                      onDismissRequest = { showSettings = false },
                      title = { Text("Gemini API Key") },
                      text = { Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          Text("Google AI Studio से free API Key लें", style = MaterialTheme.typography.bodySmall)
                          OutlinedTextField(value = keyInput, onValueChange = { keyInput = it }, label = { Text("API Key") }, visualTransformation = PasswordVisualTransformation(), singleLine = true, modifier = Modifier.fillMaxWidth())
                      } },
                      confirmButton = { Button(onClick = { onSaveKey(keyInput); showSettings = false }) { Text("सेव करें") } },
                      dismissButton = { if (apiKey.isNotBlank()) TextButton(onClick = { onRemoveKey(); keyInput = ""; showSettings = false }) { Text("हटाएँ", color = MaterialTheme.colorScheme.error) } }
                  )
              }

              if (showAddSubject) {
                  var name by remember { mutableStateOf("") }; var topic by remember { mutableStateOf("") }; var type by remember { mutableStateOf("hindi") }
                  AlertDialog(
                      onDismissRequest = { showAddSubject = false },
                      title = { Text("नया सब्जेक्ट जोड़ें") },
                      text = { Column(verticalArrangement = Arrangement.spacedBy(8.dp)) {
                          OutlinedTextField(name, { name = it }, label = { Text("नाम") }, modifier = Modifier.fillMaxWidth())
                          OutlinedTextField(topic, { topic = it }, label = { Text("Topic") }, modifier = Modifier.fillMaxWidth())
                          OutlinedTextField(type, { type = it }, label = { Text("Type") }, modifier = Modifier.fillMaxWidth())
                      } },
                      confirmButton = { Button(onClick = { if (name.isNotBlank()) { onAddSubject(Subject(name, topic.ifBlank { name }, type)); showAddSubject = false } }) { Text("जोड़ें") } },
                      dismissButton = { TextButton(onClick = { showAddSubject = false }) { Text("रद्द") } }
                  )
              }

              if (state.pendingUris != null) {
                  AlertDialog(
                      onDismissRequest = onCancelSelection, title = { Text("सब्जेक्ट चुनें") },
                      text = { Column(Modifier.verticalScroll(rememberScrollState()).heightIn(max = 400.dp)) {
                          subjects.forEach { sub ->
                              Card(modifier = Modifier.fillMaxWidth().padding(vertical = 4.dp), onClick = { onSubjectSelected(sub) }, colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceVariant)) {
                                  Row(Modifier.padding(14.dp), verticalAlignment = Alignment.CenterVertically) {
                                      Text(sub.name, style = MaterialTheme.typography.bodyLarge); Spacer(Modifier.weight(1f)); AssistChip(onClick = { onSubjectSelected(sub) }, label = { Text(sub.type, fontSize = 10.sp) })
                                  }
                              }
                          }
                      } },
                      confirmButton = { TextButton(onClick = onCancelSelection) { Text("रद्द") } }
                  )
              }

              Scaffold(
                  topBar = { TopAppBar(title = { Column { Text("HindiScan", fontWeight = FontWeight.Bold, fontSize = 22.sp); Text("AI-Pro · Verified Packs", fontSize = 11.sp, color = MaterialTheme.colorScheme.onSurfaceVariant) } }, actions = {
                      IconButton(onClick = { showAddSubject = true }) { Text("➕", fontSize = 20.sp) }
                      IconButton(onClick = { showSettings = true }) { val color = if (apiKey.isBlank()) MaterialTheme.colorScheme.error else MaterialTheme.colorScheme.secondary; Text("⚙", fontSize = 20.sp, color = color) }
                  }, colors = TopAppBarDefaults.topAppBarColors(containerColor = MaterialTheme.colorScheme.background)) }
              ) { pad ->
                  Column(Modifier.padding(pad).padding(16.dp).verticalScroll(rememberScrollState()).fillMaxSize(), verticalArrangement = Arrangement.spacedBy(14.dp)) {
                      if (apiKey.isBlank()) { Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.errorContainer.copy(alpha = 0.35f))) { Row(Modifier.padding(12.dp), verticalAlignment = Alignment.CenterVertically) { Text("⚠️"); Spacer(Modifier.width(10.dp)); Text("API Key सेट नहीं है", color = MaterialTheme.colorScheme.error) } } }
                      
                      Button(onClick = onStartScan, enabled = !state.isProcessing && apiKey.isNotBlank(), modifier = Modifier.fillMaxWidth().height(64.dp).clip(RoundedCornerShape(16.dp)).background(Brush.horizontalGradient(listOf(MaterialTheme.colorScheme.primary, MaterialTheme.colorScheme.secondary))), colors = ButtonDefaults.buttonColors(containerColor = Color.Transparent)) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally) { Text(if (state.isProcessing) "प्रोसेसिंग…" else "📷  स्कैन / PDF चुनें", fontSize = 16.sp, fontWeight = FontWeight.SemiBold); if (!state.isProcessing) Text("किसी भी भाषा → शुद्ध हिंदी", fontSize = 11.sp) }
                      }

                      if (state.isProcessing) { Card { Column(Modifier.padding(16.dp)) { Row(verticalAlignment = Alignment.CenterVertically) { CircularProgressIndicator(modifier = Modifier.size(18.dp), strokeWidth = 2.dp); Spacer(Modifier.width(12.dp)); Text(state.progressText, maxLines = 2, overflow = TextOverflow.Ellipsis) }; Spacer(Modifier.height(12.dp)); LinearProgressIndicator(progress = { state.progress }, modifier = Modifier.fillMaxWidth().height(6.dp).clip(RoundedCornerShape(3.dp))) } } }
                      
                      state.error?.let { Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.errorContainer.copy(alpha = 0.4f))) { Text("❌  $it", Modifier.padding(14.dp), color = MaterialTheme.colorScheme.error) } }
                      state.savedMsg?.let { Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.secondaryContainer.copy(alpha = 0.5f))) { Text(it, Modifier.padding(14.dp), color = MaterialTheme.colorScheme.secondary, fontWeight = FontWeight.Medium) } }

                      if (state.questions.isNotEmpty()) {
                          Spacer(Modifier.height(4.dp))
                          Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(10.dp)) { StatCard(Modifier.weight(1f), "प्रश्न", state.questions.size.toString()); StatCard(Modifier.weight(1f), "टॉपिक", state.questions.map { it.topic }.distinct().size.toString()) }
                          Spacer(Modifier.height(8.dp))
                          Button(onClick = onExport, modifier = Modifier.fillMaxWidth().height(52.dp), colors = ButtonDefaults.buttonColors(containerColor = MaterialTheme.colorScheme.secondary)) { Text("📦  Complete JSON Pack Download", fontWeight = FontWeight.SemiBold) }
                          Spacer(Modifier.height(16.dp))
                          Text("JSON Preview", style = MaterialTheme.typography.titleSmall)
                          Card(colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surface), modifier = Modifier.fillMaxWidth()) {
                              SelectionContainer { Text(state.rawJson.take(3000) + if (state.rawJson.length > 3000) "\n\n…" else "", Modifier.padding(14.dp).heightIn(max = 300.dp).verticalScroll(rememberScrollState()), style = MaterialTheme.typography.bodySmall, fontSize = 11.sp) }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun StatCard(modifier: Modifier, label: String, value: String) {
              Card(modifier = modifier, colors = CardDefaults.cardColors(containerColor = MaterialTheme.colorScheme.surfaceVariant)) {
                  Column(Modifier.fillMaxWidth().padding(12.dp), horizontalAlignment = Alignment.CenterHorizontally) { Text(value, fontSize = 22.sp, fontWeight = FontWeight.Bold, color = MaterialTheme.colorScheme.primary); Text(label, fontSize = 11.sp, color = MaterialTheme.colorScheme.onSurfaceVariant) }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6
          cache-disabled: true

      - name: Build Debug APK
        run: |
          cd project_folder
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HindiScan-APK
          path: project_folder/app/build/outputs/apk/debug/app-debug.apk
