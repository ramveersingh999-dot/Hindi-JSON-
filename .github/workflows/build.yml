      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6
          cache-disabled: true

      - name: Build Debug APK
        run: |
          cd project_folder
          gradle assembleDebug

      # यह स्टेप APK को GitHub Releases में अपने आप अपलोड कर देगा
      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: project_folder/app/build/outputs/apk/debug/app-debug.apk
          tag_name: v17.0
          name: HindiScan v17.0 Update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HindiScan-APK
          path: project_folder/app/build/outputs/apk/debug/app-debug.apk
